<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
(function () {
  var loaded = {};
  function hrefFor(parts) {
    return 'https://fonts.googleapis.com/css2?' + parts.join('&') + '&display=swap';
  }
  function add(id, href) {
    if (loaded[id] || document.getElementById(id)) {
      loaded[id] = true;
      return;
    }
    var l = document.createElement('link');
    l.id = id;
    l.rel = 'stylesheet';
    l.href = href;
    document.head.appendChild(l);
    loaded[id] = true;
  }
  function detectLang() {
    try {
      var s = localStorage.getItem('usa-travel-lang');
      if (s === 'zh' || s === 'ja' || s === 'es' || s === 'en') return s;
    } catch (e) { /* ignore */ }
    try {
      var n = String(navigator.language || '').toLowerCase();
      if (n.indexOf('zh') === 0) return 'zh';
      if (n.indexOf('ja') === 0) return 'ja';
    } catch (e2) { /* ignore */ }
    return 'en';
  }
  function detectStyle() {
    try {
      var st = localStorage.getItem('usa-travel-style');
      if (st === 'classic' || st === 'modern') return st;
    } catch (e) { /* ignore */ }
    return 'modern';
  }
  function apply() {
    add('usa-font-sans', hrefFor(['family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400']));
    var classic = detectStyle() === 'classic';
    var lang = detectLang();
    if (classic) {
      add('usa-font-classic', hrefFor([
        'family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,700',
        'family=Special+Elite'
      ]));
    }
    if (lang === 'zh') {
      add('usa-font-zh', hrefFor(classic
        ? ['family=Noto+Sans+SC:wght@300;400;500;600;700', 'family=Noto+Serif+SC:wght@400;500;700;900']
        : ['family=Noto+Sans+SC:wght@300;400;500;600;700']));
    }
    if (lang === 'ja') {
      add('usa-font-ja', hrefFor(classic
        ? ['family=Noto+Sans+JP:wght@300;400;500;600;700', 'family=Noto+Serif+JP:wght@400;500;700;900']
        : ['family=Noto+Sans+JP:wght@300;400;500;600;700']));
    }
  }
  apply();
  window.__usaTravelLoadFonts = apply;
})();
</script>
<noscript>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
</noscript>
